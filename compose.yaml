services:
  postgres:
    image: postgres:17-alpine
    container_name: candidai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: candidai
      POSTGRES_USER: candidai_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
