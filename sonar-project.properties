# SonarQube / SonarCloud configuration for CandidAI
sonar.projectKey=humaNukr_CandidAI
sonar.projectName=CandidAI
sonar.organization=humanukr

# Source and Test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Test execution and coverage reports
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results/test,build/test-results/e2eTest

# Exclusions for boilerplate and auto-generated code
sonar.exclusions=**/db/changelog/**,**/config/**,**/dto/**,**/model/**
sonar.coverage.exclusions=**/db/changelog/**,**/config/**,**/dto/**,**/model/**,**/Application.java
