candidai:
  starter:
    enabled: true
    environment: dev
    response:
      service-name: CandidAI-Dev
      include-execution-time: true
      include-environment: true
  security:
    jwt:
      secret: candidai-super-secret-jwt-key-for-dev-environment-at-least-256-bits-long-hmac-sha!
      expiration-minutes: 120

logging:
  level:
    root: INFO
    ua.edu.ukma.candidai: DEBUG

spring:
  thymeleaf:
    cache: false
