server:
  address: "${SERVER_ADDRESS:::}"
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}

spring:
  main:
    banner-mode: "off"
  jpa:
    show-sql: false

candidai:
  starter:
    enabled: true
    environment: prod
    response:
      service-name: CandidAI
      include-execution-time: false
      include-environment: false
  security:
    jwt:
      secret: ${JWT_SECRET:candidai-super-secret-jwt-key-for-prod-environment-at-least-256-bits-long-hmac-sha!}
      expiration-minutes: 60

logging:
  level:
    root: warn
    org.springframework.boot: INFO
    com.zaxxer.hikari: INFO
    ua.edu.ukma.candidai: INFO
