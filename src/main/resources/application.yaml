spring:
  application:
    name: CandidAI
  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: true
  mvc:
    problem-details:
      enabled: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/candidai}
    username: ${DB_USERNAME:candidai_user}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

candidai:
  starter:
    enabled: true
    environment: default
    response:
      service-name: CandidAI
      include-execution-time: true
      include-environment: true
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com
    timeout-seconds: 15
notification:
  mail:
    enabled: ${MAIL_ENABLED:false}
    template-name: mail/notification-email
    default-action-url: https://candidai.ukma.edu.ua
    default-recipient-name: there
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
    polling-interval-ms: 5000
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
