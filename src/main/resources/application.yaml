spring:
  application:
    name: CandidAI
  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: true
  mvc:
    problem-details:
      enabled: true

candidai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com
    timeout-seconds: 15
