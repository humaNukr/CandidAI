<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{application.apply.title})}">
    <title>Подати заявку - CandidAI</title>
</head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="card-title mb-1" th:text="#{application.apply.heading}">Подання заявки на вакансію</h4>
                    <p class="card-subtitle mb-0 text-white-50" th:text="${vacancyTitle}">Назва вакансії</p>
                </div>
                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}">Помилка</span>
                    </div>

                    <form th:action="@{/vacancies/{id}/apply(id=${vacancyId})}"
                          th:object="${form}"
                          method="post"
                          novalidate>

                        <div class="mb-3">
                            <label for="candidateName" class="form-label fw-semibold">
                                <span th:text="#{application.candidateName.label}">Повне ім'я</span>
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   id="candidateName"
                                   th:field="*{candidateName}"
                                   class="form-control"
                                   th:errorclass="is-invalid"
                                   placeholder="Іван Петренко"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('candidateName')}" th:errors="*{candidateName}">
                                Помилка імені
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">
                                <span th:text="#{application.email.label}">Електронна пошта</span>
                                <span class="text-danger">*</span>
                            </label>
                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:errorclass="is-invalid"
                                   placeholder="candidate@example.com"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                Помилка email
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">
                                <span th:text="#{application.phone.label}">Номер телефону</span>
                            </label>
                            <input type="tel"
                                   id="phone"
                                   th:field="*{phone}"
                                   class="form-control"
                                   th:errorclass="is-invalid"
                                   placeholder="+380501234567">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">
                                Некоректний формат телефону (+380...)
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="resumeUrl" class="form-label fw-semibold">
                                <span th:text="#{application.resumeUrl.label}">Посилання на резюме (PDF/DOCX)</span>
                                <span class="text-danger">*</span>
                            </label>
                            <input type="url"
                                   id="resumeUrl"
                                   th:field="*{resumeUrl}"
                                   class="form-control"
                                   th:errorclass="is-invalid"
                                   placeholder="https://storage.candidai.com/resumes/my_resume.pdf"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('resumeUrl')}" th:errors="*{resumeUrl}">
                                Вкажіть дійсне URL-посилання на резюме
                            </div>
                            <div class="form-text text-muted" th:text="#{application.resumeUrl.hint}">
                                Пряме посилання на завантажене резюме у хмарному сховищі.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="coverLetter" class="form-label fw-semibold" th:text="#{application.coverLetter.label}">
                                Супровідний лист
                            </label>
                            <textarea id="coverLetter"
                                      th:field="*{coverLetter}"
                                      class="form-control"
                                      th:errorclass="is-invalid"
                                      rows="4"
                                      placeholder="Розкажіть про свій досвід та чому вас зацікавила вакансія..."></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('coverLetter')}" th:errors="*{coverLetter}">
                                Занадто довгий текст
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                            <a th:href="@{/vacancies}" class="btn btn-outline-secondary" th:text="#{application.btn.cancel}">
                                Скасувати
                            </a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold" th:text="#{application.btn.submit}">
                                Надіслати заявку
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
