<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- CSRF tokens for AJAX / fetch requests from Thymeleaf views -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <title th:text="${title}">CandidAI</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/vacancies}" th:text="#{app.title}">CandidAI</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/vacancies}" th:text="#{nav.vacancies}">Вакансії</a>
                </li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="d-flex gap-2">
                <a href="?lang=uk" class="link-light text-decoration-none"
                   th:classappend="${#locale.language == 'uk'} ? 'fw-bold text-decoration-underline'">UA</a>
                <a href="?lang=en" class="link-light text-decoration-none"
                   th:classappend="${#locale.language == 'en'} ? 'fw-bold text-decoration-underline'">EN</a>
            </span>
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                <span class="text-light">
                    <span th:text="#{nav.user}">Користувач</span>: <strong sec:authentication="name">user</strong>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm" th:text="#{nav.logout}">Вийти</button>
                </form>
            </div>
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm" th:text="#{nav.login}">Увійти</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
