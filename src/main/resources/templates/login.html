<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container narrow">
    <h1 class="h3 mb-3 text-center" th:text="#{login.heading}">Вхід до системи CandidAI</h1>

    <div class="card p-4">
        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">
                Невірне ім’я користувача або пароль.
            </div>
            <div th:if="${param.logout}" class="alert alert-info" th:text="#{login.logout}">
                Ви успішно вийшли із системи.
            </div>

            <div class="mb-3">
                <label for="username" class="form-label" th:text="#{login.username}">Електронна пошта</label>
                <input type="text" id="username" name="username" class="form-control"
                       autocomplete="username" th:placeholder="#{login.username.placeholder}" required autofocus/>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label" th:text="#{login.password}">Пароль</label>
                <input type="password" id="password" name="password" class="form-control"
                       autocomplete="current-password" th:placeholder="#{login.password.placeholder}" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100" th:text="#{login.submit}">Увійти</button>
        </form>
    </div>
</main>
</body>
</html>
