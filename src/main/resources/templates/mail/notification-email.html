<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${subject}">CandidAI Notification</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    table {
      border-collapse: collapse;
    }
    .wrapper {
      width: 100%;
      background-color: #f4f6f8;
      padding: 40px 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    .header {
      background-color: #0f172a;
      padding: 24px 32px;
      text-align: left;
    }
    .brand {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .tagline {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .content {
      padding: 32px;
    }
    .greeting {
      font-size: 16px;
      color: #475569;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .subject {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .body-content {
      font-size: 15px;
      line-height: 1.6;
      color: #334155;
      margin-bottom: 32px;
      white-space: pre-wrap;
    }
    .action-button {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff !important;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 6px;
    }
    .footer {
      text-align: center;
      padding: 24px 32px;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #f1f5f9;
      background-color: #fafafa;
    }
    .footer p {
      margin: 4px 0;
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="wrapper" style="width: 100%; background-color: #f4f6f8; padding: 40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="container" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden;">
          <!-- Header -->
          <tr>
            <td class="header" style="background-color: #0f172a; padding: 24px 32px; text-align: left;">
              <h1 class="brand" style="color: #ffffff; font-size: 20px; font-weight: 700; margin: 0;">CandidAI</h1>
              <div class="tagline" style="color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;">Recruitment Platform</div>
            </td>
          </tr>
          <!-- Main Content -->
          <tr>
            <td class="content" style="padding: 32px;">
              <p class="greeting" style="font-size: 16px; color: #475569; margin-top: 0; margin-bottom: 20px;">
                Hello, <span th:text="${recipientName}">Candidate</span>!
              </p>
              <h2 class="subject" th:text="${subject}" style="font-size: 22px; font-weight: 700; color: #0f172a; line-height: 1.3; margin-top: 0; margin-bottom: 20px;">Subject</h2>
              <div class="body-content" th:text="${body}" style="font-size: 15px; line-height: 1.6; color: #334155; margin-bottom: 32px; white-space: pre-wrap;">Body</div>
                <a th:href="${actionUrl}"
                   class="action-button"
                   style="display: inline-block; background-color: #2563eb; color: #ffffff !important; font-size: 15px; font-weight: 600; text-decoration: none; padding: 12px 28px; border-radius: 6px;">
                  Open CandidAI Platform
                </a>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td class="footer" style="text-align: center; padding: 24px 32px; font-size: 12px; color: #64748b; border-top: 1px solid #f1f5f9; background-color: #fafafa;">
              <p style="margin: 4px 0;">This is an automated notification. Please do not reply directly to this email.</p>
              <p style="margin: 4px 0;">&copy; <span th:text="${year}">2026</span> CandidAI. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
